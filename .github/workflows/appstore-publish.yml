# Copy this file to your product repo at .github/workflows/appstore-publish.yml
name: App Store Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.1.0)'
        required: true
        type: string
      skip_screenshots:
        description: 'Skip screenshot upload'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Obelisk CLI
        run: npm install -g obelisk-cli

      - name: Decode API Key
        run: echo "${{ secrets.APPSTORE_API_KEY_BASE64 }}" | base64 --decode > AuthKey.p8

      - name: Publish to App Store
        env:
          OBELISK_ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          OBELISK_ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          obelisk publish \
            --manifest obelisk/manifest.json \
            --key AuthKey.p8 \
            --version ${{ inputs.version }} \
            ${{ inputs.skip_screenshots && '--skip-screenshots' || '' }}

      - name: Cleanup
        if: always()
        run: rm -f AuthKey.p8
