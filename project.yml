name: Lexa
options:
  bundleIdPrefix: com.peter
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: F883XBKWR3
    CODE_SIGN_STYLE: Automatic
targets:
  Lexa:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/*.json"
      - path: Sources/Resources
        buildPhase: resources
        excludes:
          - "Assets.xcassets/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.Lexa
        PRODUCT_NAME: Lexa
        INFOPLIST_KEY_CFBundleDisplayName: "拾词 Lexa - 背单词"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: F883XBKWR3
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  LexaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Lexa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.Lexa.unittests
        GENERATE_INFOPLIST_FILE: YES
  LexaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Lexa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.Lexa.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lexa
schemes:
  Lexa:
    build:
      targets:
        Lexa: all
        LexaTests: [test]
        LexaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LexaTests
        - LexaUITests
    archive:
      config: Release
